name: Publish Go Module

on:
  push:
    tags:
      - "go/v*"

jobs:
  check-go:
    name: Check Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: make check-go

  validate:
    name: Validate Go Module
    runs-on: ubuntu-latest
    needs: check-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#go/}" >> "$GITHUB_OUTPUT"

      - name: Verify module is fetchable
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/driangle/agentrunner/go@${{ steps.version.outputs.version }}"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Go $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

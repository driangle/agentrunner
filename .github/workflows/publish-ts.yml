name: Publish TypeScript Package

on:
  push:
    tags:
      - "ts/v*"

jobs:
  check-ts:
    name: Check TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd ts && npm ci
      - run: make check-ts

  publish-npm:
    name: Publish to npm
    needs: check-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#ts/v}"
          pkg_version="$(jq -r .version ts/package.json)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version $tag_version does not match ts/package.json version $pkg_version"
            exit 1
          fi

      - name: Install and build
        run: |
          cd ts
          npm ci
          npm run build

      - name: Publish
        run: cd ts && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: |
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "TypeScript $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
